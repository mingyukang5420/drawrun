version: '3.8'
services:
  localPostgis:
    image: postgis/postgis:16-3.4
    container_name: localPostgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ssafy1234!
      POSTGRES_DB: running
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localRedis:
    image: redis:alpine
    container_name: localRedis
    restart: unless-stopped
    command: redis-server --port 6379 --requirepass ssafy1234! --appendonly yes
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Seoul
    volumes:
      - redis_data:/data

