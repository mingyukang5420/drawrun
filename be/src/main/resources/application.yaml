spring:
  profiles:
    active: local
  application:
    name: app
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  threads:
    virtual:
      enabled: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  secret: ${JWTSECRET}
  access-token-expiration: 1800000   # 30분 (ms)
  refresh-token-expiration: 2592000000 # 30일 (ms)

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    config-url: /api/v1/api-docs/swagger-config
    url: /api/v1/api-docs

server:
  forward-headers-strategy: framework

app:
  upload:
    track-image-dir: /home/ubuntu/app/uploads/tracks #서버에 저장할 경로
    track-image-url-prefix: /uploads/tracks #업로드 후 응답이나 DB에 저장할 공개 경로의 앞부분
                            #임시로 uploads/tracks로 설정
