spring:
  profiles:
    active: local
  application:
    name: app
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  threads:
    virtual:
      enabled: true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  secret: ${JWTSECRET}
  access-token-expiration: 1800000   # 30분 (ms)
  refresh-token-expiration: 2592000000 # 30일 (ms)

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    config-url: /api/v1/api-docs/swagger-config
    url: /api/v1/api-docs

server:
  forward-headers-strategy: framework