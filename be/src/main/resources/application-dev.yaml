spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  secret: ${JWTSECRET}
  access-token-expiration: 2592000000   # 30일 (ms)
  refresh-token-expiration: 2592000000 # 30일 (ms)

gms:
  base-url: https://gms.ssafy.io/gmsapi/api.openai.com/v1
  api-key: ${GMS_API_KEY:}
  analysis-model: gpt-4o
  image-model: gpt-image-1.5
  image-size: 1024x1024
  image-count: 1

logging:
  level:
    root: INFO
    com.running.app: DEBUG
