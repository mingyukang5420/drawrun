server {
    listen 80;
    server_name k14a103.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name k14a103.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/k14a103.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k14a103.p.ssafy.io/privkey.pem;

    location / {
        return 200 'Nginx HTTPS works!';
        add_header Content-Type text/plain;
    }
}
