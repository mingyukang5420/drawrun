server {
    listen 80;
    server_name k14a103.p.ssafy.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name k14a103.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/k14a103.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k14a103.p.ssafy.io/privkey.pem;

    client_max_body_size 50M;

    location /jenkins {
        proxy_pass http://jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /infra/webhook {
        proxy_pass http://webhookbridge:9103;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/tracks/ {
        alias /uploads/tracks/;

        location ~* \.(jpg|jpeg|png|gif|webp)$ {
            try_files $uri =404;
            access_log off;
        }

        location ~* \.(php|sh|py|env)$ {
            deny all;
        }

    }

}