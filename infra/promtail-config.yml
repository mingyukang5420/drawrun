server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    # Promtail이 로그 읽은 다음 Loki로 보내기전 가공
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs

      - json:
          source: attrs
          expressions:
            tag: tag

      - regex:
          source: tag
          expression: "^(?P<container_name>[^/]+)"

      - labels:
          stream:
          container_name:

      - output:
          source: output



